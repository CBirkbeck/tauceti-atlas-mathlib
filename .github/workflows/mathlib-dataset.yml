name: Mathlib dataset

# Extracts Mathlib's declarations and their dependencies (trust-extract, the extractor the Tau Ceti
# review site uses) with Mathlib itself as the library, at the commit data/mathlib-pin.json names,
# and publishes the dataset as the release mathlib-dataset-<commit>-upstream. scripts/mathlib_disk.py
# reads it to place Mathlib's key definitions and theorems on the disk. The extraction follows
# dependencies into Lean and Batteries too (--upstream-closure term), so that the disk can count what
# Mathlib takes from them: ℕ, ℤ, `%` on ℤ (Int.emod). A push that changes the pin extracts again; a
# commit already published is not extracted twice.
on:
  push:
    branches: [main]
    paths: ['data/mathlib-pin.json', '.github/workflows/mathlib-dataset.yml']
  workflow_dispatch:
    inputs:
      commit:
        description: The Mathlib commit (default the pinned one)
        required: false

permissions:
  contents: write

concurrency:
  group: mathlib-dataset
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Which commit
        run: |
          commit="${{ inputs.commit }}"
          [ -n "$commit" ] || commit=$(python3 -c "import json; print(json.load(open('data/mathlib-pin.json'))['mathlib'])")
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "TAG=mathlib-dataset-${commit:0:12}-upstream" >> "$GITHUB_ENV"
      - name: Already published?
        id: published
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already published"; echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Room on the runner
        if: steps.published.outputs.done != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Mathlib at the commit
        if: steps.published.outputs.done != 'true'
        run: |
          git clone -q --filter=blob:none https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib4"
          git -C "$RUNNER_TEMP/mathlib4" checkout -q "$COMMIT"
          cat "$RUNNER_TEMP/mathlib4/lean-toolchain"
      - name: Lean
        if: steps.published.outputs.done != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib from its cache
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/mathlib4
        run: |
          lake exe cache get
          if ! lake build --no-build Mathlib > /dev/null 2>&1; then
            echo "::notice::Not every module is in the cache; building the rest"
            lake build Mathlib 2>&1 | tail -5
          fi
          df -h / | tail -1
      - name: The extractor, of the pinned series
        if: steps.published.outputs.done != 'true'
        run: |
          tag=$(python3 scripts/extractor.py install "$RUNNER_TEMP/mathlib4/lean-toolchain" "$RUNNER_TEMP/extractor")
          bin=$(find "$RUNNER_TEMP/extractor" -type f -name trust-extract | head -1)
          [ -x "$bin" ] || { echo "::error::no trust-extract in release $tag"; exit 1; }
          echo "EXTRACTOR_TAG=$tag" >> "$GITHUB_ENV"
          echo "EXTRACTOR_BIN=$bin" >> "$GITHUB_ENV"
      - name: Extract
        if: steps.published.outputs.done != 'true'
        working-directory: ${{ runner.temp }}/mathlib4
        run: |
          sudo sysctl -q -w vm.max_map_count=262144 || true
          lake env "$EXTRACTOR_BIN" extract --root Mathlib --repo leanprover-community/mathlib4 --out "$RUNNER_TEMP/dataset" \
            --parts 8 --jobs 1 --no-statements --no-upstream-docs --upstream-closure term
          du -sh "$RUNNER_TEMP/dataset"
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print({k: m[k] for k in ('spec','producer','modules','library')})" "$RUNNER_TEMP/dataset/meta.json"
      - name: Publish
        if: steps.published.outputs.done != 'true'
        run: |
          tar -C "$RUNNER_TEMP/dataset" -czf "$RUNNER_TEMP/dataset.tar.gz" .
          ls -la "$RUNNER_TEMP/dataset.tar.gz"
          gh release create "$TAG" "$RUNNER_TEMP/dataset.tar.gz" -R "$GITHUB_REPOSITORY" \
            --title "Mathlib dataset ${COMMIT:0:12}, with Lean and Batteries beneath it" \
            --notes "trust-extract $EXTRACTOR_TAG over Mathlib (root \`Mathlib\`) at leanprover-community/mathlib4@$COMMIT, following dependencies into Lean and Batteries (\`--upstream-closure term\`)."
